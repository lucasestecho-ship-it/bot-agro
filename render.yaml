services:
  - type: web
    name: bot-agro-campo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:fastapi_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_DIR
        value: /tmp/campo_bot
      - key: FIELD_APP_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: ENABLE_TELEGRAM_BOT
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CAPATAZ_AGENT_MODEL
        value: gpt-4o-mini
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: MY_CHAT_ID
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER
        value: lucas.estecho@gmail.com
      - key: CDSE_CLIENT_ID
        sync: false
      - key: CDSE_CLIENT_SECRET
        sync: false
      - key: CDSE_NDVI_LOOKBACK_DAYS
        value: "45"
      - key: CDSE_NDVI_YEARS
        value: "9"
      - key: CDSE_NDVI_WIDTH
        value: "768"
      - key: CDSE_NDVI_HEIGHT
        value: "768"
      - key: CDSE_MAX_CLOUD_PERCENT
        value: "60"
